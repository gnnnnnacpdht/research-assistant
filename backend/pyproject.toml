[project]
name = "research-assistant-backend"
version = "0.1.0"
description = "科研助手 FastAPI 后端"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "pymupdf>=1.24.0,<2.0.0",
    "python-multipart>=0.0.9,<1.0.0",
    # RAG：本地嵌入式向量库，零额外部署
    "chromadb>=0.5.0,<2.0.0",
    # 调用 SiliconFlow / DeepSeek 的 HTTP 客户端
    "httpx>=0.27.0,<1.0.0",
    # 读取项目根目录 .env 里的密钥
    "python-dotenv>=1.0.0,<2.0.0",
    # 引用图谱：PageRank 等图算法
    "networkx>=3.0,<4.0.0",
]

[tool.uv]
package = false
